<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Notes</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}
body{background:#0f0f14;color:#e6e6ec;height:100vh;display:flex}
.side{width:240px;background:#16161e;border-right:1px solid #2a2a3a;display:flex;flex-direction:column}
.head{padding:14px;border-bottom:1px solid #2a2a3a;display:flex;justify-content:space-between;align-items:center}
.head h1{font-size:1rem;color:#a78bfa}
.btn{background:#a78bfa;color:#fff;width:28px;height:28px;border:none;border-radius:6px;font-size:1.1rem;cursor:pointer;font-weight:600}
.list{flex:1;overflow-y:auto;padding:8px}
.item{padding:10px 12px;border-radius:6px;cursor:pointer;margin-bottom:4px;font-size:.85rem}
.item:hover{background:#1a1a24}
.item.act{background:#a78bfa22;border-left:3px solid #a78bfa}
.item .t{font-weight:600;color:#c0caf5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .d{color:#565f89;font-size:.7rem;margin-top:2px}
.main{flex:1;display:flex;flex-direction:column}
.edit{padding:16px;flex:1;display:flex;flex-direction:column}
#title{background:none;border:none;color:#c0caf5;font-size:1.4rem;font-weight:700;outline:none;margin-bottom:10px}
#body{flex:1;background:#1a1a24;border:1px solid #2a2a3a;border-radius:8px;padding:14px;color:#e6e6ec;font-size:.9rem;line-height:1.6;outline:none;resize:none;font-family:inherit}
#body:focus{border-color:#a78bfa}
.status{padding:8px 16px;color:#565f89;font-size:.75rem;border-top:1px solid #2a2a3a}
</style></head><body>
<div class="side">
<div class="head"><h1>📔 Notes</h1><button class="btn" onclick="neu()">+</button></div>
<div class="list" id="list"></div>
</div>
<div class="main">
<div class="edit"><input id="title" placeholder="Judul..."><textarea id="body" placeholder="Tulis..."></textarea></div>
<div class="status" id="status">0 catatan</div>
</div>
<script>
const K='notes';let n=JSON.parse(localStorage.getItem(K)||'[]'),cur=-1;
const $=id=>document.getElementById(id);
function save(){localStorage.setItem(K,JSON.stringify(n));r()}
function neu(){n.unshift({t:'',b:'',ts:Date.now()});cur=0;load();r()}
function op(i){cur=i;load();r()}
function load(){$('title').value=cur>=0?n[cur].t:'';$('body').value=cur>=0?n[cur].b:''}
let to;
function auto(){clearTimeout(to);to=setTimeout(()=>{if(cur<0)return;n[cur].t=$('title').value;n[cur].b=$('body').value;n[cur].ts=Date.now();localStorage.setItem(K,JSON.stringify(n));r();$('status').textContent='✓ '+new Date().toLocaleTimeString('id-ID')},500)}
function r(){$('list').innerHTML=n.map((x,i)=>`<div class="item${i===cur?' act':''}" onclick="op(${i})"><div class="t">${x.t||'(tanpa judul)'}</div><div class="d">${new Date(x.ts).toLocaleDateString('id-ID')}</div></div>`).join('');$('status').textContent=n.length+' catatan'}
$('title').oninput=auto;$('body').oninput=auto;
if(n.length===0)neu();else{cur=0;load()}
r();
</script></body></html>
