<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>To-Do</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}
body{background:#0f0f14;color:#e6e6ec;padding:40px 20px;display:flex;justify-content:center}
.app{width:100%;max-width:480px}
h1{font-size:1.8rem;color:#a78bfa;margin-bottom:20px}
.input{display:flex;gap:8px;margin-bottom:20px}
input{flex:1;padding:12px;background:#1a1a24;border:1px solid #2a2a3a;border-radius:8px;color:#e6e6ec}
button{padding:12px 20px;background:#a78bfa;color:#fff;border:none;border-radius:8px;font-weight:600;cursor:pointer}
ul{list-style:none}
li{background:#16161e;border:1px solid #2a2a3a;border-radius:8px;padding:14px;margin-bottom:8px;display:flex;align-items:center;gap:12px}
li.done{opacity:.5;text-decoration:line-through}
li span{flex:1}
.del{background:none;color:#f7768e;padding:4px 8px;font-size:1.2rem}
</style></head><body>
<div class="app">
<h1>📝 To-Do</h1>
<div class="input"><input id="inp" placeholder="Tugas baru..."><button onclick="add()">+</button></div>
<ul id="list"></ul>
</div>
<script>
const K='todos';
let t=JSON.parse(localStorage.getItem(K)||'[]');
const $=id=>document.getElementById(id);
function save(){localStorage.setItem(K,JSON.stringify(t));r()}
function add(){const v=$('inp').value.trim();if(!v)return;t.push({t:v,d:false});$('inp').value='';save()}
function tg(i){t[i].d=!t[i].d;save()}
function del(i){t.splice(i,1);save()}
function r(){$('list').innerHTML=t.map((x,i)=>`<li class="${x.d?'done':''}"><input type="checkbox" ${x.d?'checked':''} onchange="tg(${i})"><span>${x.t}</span><button class="del" onclick="del(${i})">✕</button></li>`).join('')}
$('inp').onkeypress=e=>{if(e.key==='Enter')add()};
r();
</script></body></html>
